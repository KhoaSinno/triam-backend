[project]
name = "triam-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "edge-tts>=7.2.7",
    "fastapi>=0.128.0",
    "fpdf2>=2.8.5",
    "google-genai>=1.63.0",
    "google-generativeai>=0.8.6",
    "langchain-text-splitters>=1.1.1",
    "livekit-agents>=1.5.2",
    "livekit-plugins-deepgram>=1.5.2",
    "livekit-plugins-google>=1.5.2",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-openai>=1.5.2",
    "livekit-plugins-silero>=1.5.2",
    "mutagen>=1.47.0",
    "openai>=2.15.0",
    "pdfplumber>=0.11.0",
    "pgvector>=0.4.2",
    "pinecone>=5.0.0",
    "psycopg2-binary>=2.9.11",
    "pypdf>=6.6.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "sentence-transformers>=5.4.0",
    "sqlmodel>=0.0.38",
    "supabase>=2.15.0",
    "tavily-python>=0.7.21",
    "tiktoken>=0.12.0",
    "torch>=2.11.0",
    "uvicorn>=0.40.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[tool.ruff]
# Set the maximum line length to 200.
line-length = 200
target-version = "py312"

[tool.ruff.lint]
# Select rules to run
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
